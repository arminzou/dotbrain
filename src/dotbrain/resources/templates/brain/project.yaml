# Per-project identity. Values below are active defaults; edit as needed.
# The tool reads this file; dotbrain refresh may overwrite shared sections.

execution-engine: beads

agents:
  - claude

# Public-facing issue tracker for intake. One of: none, gh, linear.
# Set public-tracker-id when activating a tracker (e.g. "owner/repo" for gh).
public-tracker: none
# public-tracker-id: ""

# beads: deviations from global defaults only — uncomment the keys you need.
#   mode: embedded     # one of: embedded, server, none
#   remote: https://doltremoteapi.dolthub.com/owner/repo
#   database: custom_name

# Extra skills linked into this project's agent workspaces, on top of the
# brain-coupled required core (which is always wired). Operator-owned.
# skills:
#   - some-collection/some-skill
#
# Project-scoped subagents only. The global four come from ~/dotbrain/agents/agents.yaml.
# subagents:
#   - some-project-only-subagent
