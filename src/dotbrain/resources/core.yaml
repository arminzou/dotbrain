version: 1

# dotbrain's packaged subagent core (read-only product data).
# Subagents declared here are force-wired by the tool and cannot be removed by
# operators.
#
# Operators configure skills and subagents at separate scopes:
#   - skills/global:      ~/dotbrain/skills/skills.yaml               (global_extra)
#   - skills/per-project: brainspaces/<name>/.brain/project.yaml      (skills:)
#   - subagents/global:   ~/dotbrain/agents/agents.yaml               (global:)
#   - subagents/project:  brainspaces/<name>/.brain/project.yaml      (subagents:)

subagents:
  project_required:
    - implementer
    - investigator
    - reviewer
    - verifier
