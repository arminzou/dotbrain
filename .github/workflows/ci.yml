name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # Typer force-enables Rich terminal rendering under GITHUB_ACTIONS, which reformats --help/error
  # output into colored boxed panels and breaks plain-text CLI assertions. This is the officially
  # supported override (see typer/rich_utils.py) to keep CI output matching local dev output.
  _TYPER_FORCE_DISABLE_TERMINAL: "1"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest
