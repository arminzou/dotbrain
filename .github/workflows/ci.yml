name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs the same matrix at the tag before it publishes.
  workflow_call:

env:
  # Typer force-enables Rich terminal rendering under GITHUB_ACTIONS, which reformats --help/error
  # output into colored boxed panels and breaks plain-text CLI assertions. This is the officially
  # supported override (see typer/rich_utils.py) to keep CI output matching local dev output.
  _TYPER_FORCE_DISABLE_TERMINAL: "1"
  # Windows' default I/O encoding for a non-console stream (e.g. a redirected pipe) is the legacy
  # ANSI codepage, not UTF-8 — this affects both reading UTF-8-authored repo content and Rich's
  # ascii-only box-drawing fallback (Console.ascii_only checks the encoding directly). PEP 540's
  # UTF-8 mode makes both consistent with Linux/macOS.
  PYTHONUTF8: "1"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      # Experiment: the suite starts thousands of short git processes, and real-time scanning of
      # each launch may dominate the Windows job. The runner is discarded after the job.
      - name: Exclude test work from Defender scanning (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try {
            Get-MpComputerStatus | Format-List RealTimeProtectionEnabled, AMRunningMode
            Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP
            Add-MpPreference -ExclusionProcess git.exe, python.exe
            (Get-MpPreference).ExclusionPath
          } catch {
            Write-Output "Defender not configurable here: $_"
          }

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run tests
        # List the slowest tests so per-platform regressions show in the log.
        run: uv run pytest --durations=25
