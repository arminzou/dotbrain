name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing to PyPI
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A tag pushed ahead of the version bump ships installers that pin the previous
      # release. Fail the release rather than publish a mismatched one.
      - name: Verify the tag matches the pinned version
        run: |
          pinned=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pinned" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $pinned"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      # Guards plugin manifests, installers, runtime version, and the local lockfile entry.
      - name: Verify version pins are in lockstep
        run: uv run --locked pytest tests/test_plugin_build.py

      - name: Publish to PyPI
        run: |
          uv build
          uv publish --trusted-publishing automatic
