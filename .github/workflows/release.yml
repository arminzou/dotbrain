name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Publish only what passed the full suite on every platform at this exact tag.
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing to PyPI
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A tag pushed ahead of the version bump ships installers that pin the previous
      # release. Fail the release rather than publish a mismatched one.
      - name: Verify the tag matches the pinned version
        run: |
          pinned=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pinned" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $pinned"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Publish to PyPI
        run: |
          uv build
          uv publish --trusted-publishing automatic
