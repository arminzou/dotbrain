name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release-please.yml
      - release-please-config.json
      - .release-please-manifest.json

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # An App token lets the generated PR and tag trigger CI and publishing.
      - uses: actions/create-github-app-token@v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Verify release App credentials
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          actual=$(gh api "repos/$GITHUB_REPOSITORY" --jq .full_name)
          test "$actual" = "$GITHUB_REPOSITORY"
          echo "Release App authenticated for $actual with required token permissions."

      - uses: googleapis/release-please-action@v5
        if: github.event_name != 'pull_request'
        with:
          token: ${{ steps.app-token.outputs.token }}
