[project]
name = "dotbrain"
version = "0.12.0"
description = "Wires project Brainspaces and skills into coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Armin Zou" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "typer>=0.12",
  "pyyaml>=6",
]

[project.urls]
Homepage = "https://github.com/arminzou/dotbrain"
Repository = "https://github.com/arminzou/dotbrain"
Issues = "https://github.com/arminzou/dotbrain/issues"

[project.scripts]
dotbrain = "dotbrain.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dotbrain"]

# The Hermes and OpenCode plugins are delivered by the CLI, so the wheel carries them from the
# shared plugin tree; the OpenCode delivery reuses the Hermes copy of the skills.
[tool.hatch.build.targets.wheel.force-include]
"plugin/plugin.yaml" = "dotbrain/resources/hermes/plugin.yaml"
"plugin/__init__.py" = "dotbrain/resources/hermes/__init__.py"
"plugin/skills" = "dotbrain/resources/hermes/skills"
"plugin/opencode/dotbrain.js" = "dotbrain/resources/opencode/dotbrain.js"

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/docs",
  "/plugin/plugin.yaml",
  "/plugin/__init__.py",
  "/plugin/opencode",
  "/plugin/skills",
  "/src",
  "/README.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Most of the suite's time is spent waiting on real git processes; spread it across cores.
addopts = "-n auto"
