[project]
name = "dotbrain"
version = "0.2.0"
description = "Wires project Brainspaces and skills into coding agents."
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Armin Zou" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "typer>=0.12",
  "pyyaml>=6",
]

[project.urls]
Homepage = "https://github.com/arminzou/dotbrain"
Repository = "https://github.com/arminzou/dotbrain"
Issues = "https://github.com/arminzou/dotbrain/issues"

[project.scripts]
dotbrain = "dotbrain.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dotbrain"]

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/docs",
  "/src",
  "/README.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
