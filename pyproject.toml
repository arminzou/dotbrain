[project]
name = "dotbrain"
version = "0.1.0"
description = "Testable CLI for the dotbrain control plane (wire, skills link, bootstrap, unwire)."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6",
]

[project.scripts]
dotbrain = "dotbrain.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dotbrain"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
