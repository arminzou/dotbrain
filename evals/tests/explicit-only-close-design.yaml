- description: explicit-only-not-loaded-close-design
  providers: [anthropic:claude-agent-sdk]
  metadata:
    capabilityExclusions:
      - provider: openai:codex-app-server
        status: SKIPPED_UNSUPPORTED
        graders: [skill-file-not-read, skill-not-searched, skill-not-invoked]
        reason: Skill-use heuristics cannot prove absence; this provider/case is not executed or scored.
  vars:
    case: explicit-only-not-loaded-close-design
    skill: close-design
    request: >-
      The PR for our search-indexing initiative merged yesterday. Wrap up its
      design doc and mark the initiative as finished.
  assert:
    - type: not-skill-used
      value:
        pattern: '*close-design'
    - type: javascript
      value: file://assertions/evidence.cjs:noSkillRead
    - type: javascript
      value: file://assertions/evidence.cjs:noSkillSearch
    - type: javascript
      value: file://assertions/evidence.cjs:noSkillInvocation
