# Decision exercise ported from the retired runner; each `metric` is the source grader id.
# Regex graders keep their source patterns; inline (?is) flags become RegExp flags. `fresh-review` is
# widened by decision after the first live pilot: a re-request about the requested boundary also counts.
- description: observed-revision-mismatch-held
  vars:
    case: observed-revision-mismatch-held
    request: |
      Read run-execution and its execution record. You are the lead. You asked the reviewer
      (actor rev-a) for Review 1 of items alpha and beta at integrated head 4c4c4c4 on base
      1a2b3c4. It returns:

      ```text
      **Status:** APPROVE · **Observed:** 9e9e9e9
      alpha: APPROVE, all criteria met. beta: APPROVE, all criteria met. No findings.
      ```

      Both items' combined checks passed at 4c4c4c4. Decide what you record, whether either item
      can be accepted or closed now, and what happens next. Do not mutate files, run tracker
      commands, or dispatch agents.
    fixture:
      maxTurns: 40
      tools:
      - Read
      - Glob
      - Grep
      - Skill
      - Agent
      - TodoWrite
  assert:
  - type: javascript
    metric: fresh-review
    value: new RegExp("(?=[^.]*(?:re-?review|new review|fresh review|review again|refresh|re-?request\\w*[^.]{0,40}review|review[^.]{0,60}again))(?=[^.]*(?:4c4c4c4|requested (?:head|boundary|revision)|(?:that|the) boundary))[^.]+", "is").test(output)
  - type: javascript
    metric: held
    value: new RegExp("(hold|held|pending|not (be )?(record|accept)|cannot (be )?(record|accept))[^.]{0,200}(9e9e9e9|observed|mismatch|differ)|(9e9e9e9|observed|mismatch|differ)[^.]{0,200}(hold|held|pending|not (be )?(record|accept)|cannot (be )?(record|accept))", "is").test(output)
  - type: javascript
    metric: no-dispatch
    value: file://assertions/evidence.cjs:noDispatch
