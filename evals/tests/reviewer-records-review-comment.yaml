# Decision exercise ported from the retired runner; each `metric` is the source grader id.
# Regex graders keep their source patterns; inline (?is) flags become RegExp flags.
- description: reviewer-records-review-comment
  vars:
    case: reviewer-records-review-comment
    request: |
      Read run-execution and its execution record. You are the lead (actor lead-a). The reviewer
      (actor rev-a) covered items alpha, beta, and gamma at integrated head 4c4c4c4 and returned:

      ```text
      **Status:** CHANGES · **Observed:** 4c4c4c4
      alpha: CHANGES, criterion 2 unmet. beta: APPROVE. gamma: APPROVE.
      F1 high alpha src/orders.py:40 The cursor skips the 50th order.
      Limits: load behavior not exercised.
      ```

      The tracker shows `## Review 2: CHANGES @ 4c4c4c4 (round 1)` from rev-a on alpha and beta,
      and no Review 2 comment on gamma. Return the exact tracker commands you would run and
      the next operations, in order, without executing them or dispatching agents.
    fixture:
      maxTurns: 40
      tools:
      - Read
      - Glob
      - Grep
      - Skill
      - Agent
      - TodoWrite
  assert:
  - type: javascript
    metric: copy-to-gamma
    value: new RegExp("(cop(y|ies|ied)|duplicat)[^.]{0,200}(alpha|beta|sibling)[^.]{0,200}gamma|gamma[^.]{0,200}(cop(y|ies|ied)|duplicat)[^.]{0,200}(alpha|beta|sibling)", "is").test(output)
  - type: javascript
    metric: lead-writes-gamma
    value: new RegExp("bd comments add gamma\\b[^\\n]*--actor[ =]lead-a", "").test(output)
  - type: javascript
    metric: no-dispatch
    value: file://assertions/evidence.cjs:noDispatch
  - type: javascript
    metric: routes-alpha
    value: new RegExp("(resume|SendMessage|fix round)[^.]{0,200}alpha|alpha[^.]{0,200}(resume|fix round)", "is").test(output)
