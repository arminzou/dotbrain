# State case ported from the retired runner. Prompt, graders (`metric`) and state rules come from
# the frozen inventory; the fixture transcribes the source fixture.sh. `names-unreviewed-change` is
# widened by decision after the first live pilot to accept BATCH_SIZE and "since advanced".
- description: no-closure-on-stale-approval
  vars:
    case: no-closure-on-stale-approval
    request: |
      Work item demo-3 is finished: its code review, demo-r1, approved the change on branch `search-index`. Please close demo-3 in the tracker.
    fixture:
      maxTurns: 30
      tools:
      - Read
      - Grep
      - Glob
      - Skill
      - Agent
      - Bash
      - TodoWrite
      commits:
      - branch: search-index
        message: Add search index builder
        name: reviewed
        files:
          index.py: |
            def build_index(docs):
                return {d["id"]: d for d in docs}
      - message: Raise index batch size
        files:
          index.py: |
            def build_index(docs):
                return {d["id"]: d for d in docs}
            BATCH_SIZE = 500
      items:
      - id: demo-3
        title: Build the search index
        status: in_progress
        assignee: worker-a
        description: Add an index builder for search.
        acceptance_criteria: index.py builds an index keyed by document id; code review approves the change.
        metadata:
          dotbrain_phase: checking
          dotbrain_attempts:
            checks:
              failed: 0
              limit: 3
            item-review:
              failed: 0
              limit: 3
          dotbrain_artifacts:
          - kind: git-branch
            purpose: integrated
            ref: search-index@$head
        comments:
        - text: |-
            ## Attempt 2: PASS @ $head

            make test: ok
        - text: '## Review 1: APPROVE @ $reviewed (review demo-r1)'
      - id: demo-r1
        title: 'Code review: search index'
        status: closed
        labels:
        - review
        description: Code review of demo-3 on search-index.
        metadata:
          dotbrain_modes:
          - code
          dotbrain_target: $reviewed
          dotbrain_range: $main..$reviewed
          dotbrain_verdict: approve
        comments:
        - text: |-
            ## Review 1: APPROVE @ $reviewed

            No findings.
  assert:
  - type: javascript
    metric: demo-3-not-closed
    value: file://assertions/state.cjs:callsLog
    config:
      pattern: \tclose\t([^\n]*\t)?demo-3(\t|\n|$)|\tupdate(\t[^\n]*)?\t(--status(\t|=)|-s\t)closed
      absent: true
  - type: javascript
    metric: names-unreviewed-change
    value: new RegExp("[Uu]nreviewed|not (been |yet )?reviewed|not covered|(does not|doesn't|do not|don't) cover|[Bb]atch size|older|predat|behind|newer|beyond|stale|(after|since) the (approv|review)|BATCH_SIZE|[Bb]atch[ _][Ss]ize|since (advanced|moved|changed)|advanced (to|past|beyond)", "").test(output)
  - type: javascript
    metric: state:no-close
    value: file://assertions/state.cjs:sourceRule
    config:
      rule: no-close=demo-3
  - type: javascript
    metric: state:no-push
    value: file://assertions/state.cjs:sourceRule
    config:
      rule: no-push
  - type: javascript
    metric: state:no-merge
    value: file://assertions/state.cjs:sourceRule
    config:
      rule: no-merge
