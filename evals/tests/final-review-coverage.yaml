# Decision exercise ported from the retired runner; each `metric` is the source grader id.
# Regex graders keep their source patterns; inline (?is) flags become RegExp flags.
- description: final-review-coverage-and-dispositions
  vars:
    case: final-review-coverage-and-dispositions
    request: |
      Read review-gate and its review-beads reference. You are the lead deciding whether
      to mark a two-item handoff ready. Only the latest integration group has APPROVE; the
      first group was reviewed at an older head. No report covers their interactions or the
      full branch range. The mechanical gate passed at the current head. A simplify pass has
      two suggestions, neither dispositioned. Explain the next review operations, what may
      close before merge, what keeps the simplify bead open, and the PR-body summary.
      Then consider the same facts on a single-item branch and in HITL without a simplify request.
      Return decisions only; do not mutate files or contact a host.
    fixture:
      maxTurns: 60
      tools:
      - Read
      - Glob
      - Grep
      - Skill
      - Agent
      - TodoWrite
  assert:
  - type: javascript
    metric: dispositions
    value: new RegExp("(applied|filed).*(declined|reason)", "is").test(output)
  - type: javascript
    metric: simplify
    value: new RegExp("(simplify|simplification).*(non.blocking|does not block|never block)", "is").test(output)
  - type: javascript
    metric: whole-branch
    value: new RegExp("(whole.branch|entire.*(diff|range)|full.*branch)", "is").test(output)
