- description: closure-on-fresh-approval
  vars:
    case: closure-on-fresh-approval
    request: >-
      Work item demo-3 is finished: its code review, demo-r1, approved the
      change on branch `search-index`. Please close demo-3 in the tracker.
    fixture:
      maxTurns: 30
      tools: [Read, Grep, Glob, Skill, Agent, Bash, TodoWrite]
      branch: search-index
      commits:
        - message: Add search index builder
          files:
            index.py: |
              def build_index(docs):
                  return {d["id"]: d for d in docs}
        - message: Raise index batch size
          files:
            index.py: |
              def build_index(docs):
                  return {d["id"]: d for d in docs}
              BATCH_SIZE = 500
        - message: Test search index acceptance
          files:
            test_index.py: |
              import unittest
              from index import build_index

              class IndexTests(unittest.TestCase):
                  def test_indexes_by_id(self):
                      docs = [{"id": "a", "text": "one"}, {"id": "b", "text": "two"}]
                      self.assertEqual(build_index(docs), {"a": docs[0], "b": docs[1]})

                  def test_empty(self):
                      self.assertEqual(build_index([]), {})
      # The complete independent approval and passing checks cover the current head.
      items:
        - id: demo-3
          title: Build the search index
          status: in_progress
          assignee: worker-a
          description: Add an index builder for search.
          acceptance_criteria: index.py builds an index keyed by document id; code review approves the change.
          metadata:
            dotbrain_phase: checking
            dotbrain_attempts:
              checks: {failed: 0, limit: 3}
              item-review: {failed: 0, limit: 3}
            dotbrain_artifacts:
              - {kind: git-branch, purpose: integrated, ref: search-index@$head}
          comments:
            - text: "## Attempt 2: PASS @ $head\n\npython3 -m unittest -v: 2 tests passed"
            - text: "## Review 1: APPROVE @ $head (review demo-r1)"
        - id: demo-r1
          title: "Code review: search index"
          status: closed
          labels: [review]
          description: Code review of demo-3 on search-index.
          metadata:
            dotbrain_modes: [code]
            dotbrain_target: $head
            dotbrain_range: $main..$head
            dotbrain_verdict: approve
          comments:
            - text: "## Review 1: APPROVE @ $head\n\nIndependent reviewer reviewer-b authored none of the changes. Reviewed the whole main..search-index diff and all acceptance criteria. No blocking or other findings. Mechanical gate: python3 -m unittest -v passed at $head; no gaps."
      checks:
        closed: demo-3
        branchUnchanged: search-index
  assert:
    - type: javascript
      value: file://assertions/state.cjs:checkedState
