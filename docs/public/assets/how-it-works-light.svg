<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
  <title id="title">Your code connected to private project context</title>
  <desc id="desc">Claude Code and Codex work in your code repo. Gitignored links connect the repo to a separate private Brainspace containing the Brain for vocabulary, decisions, and designs, and Beads for issues and execution state.</desc>
