<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 64 880 456" role="img" aria-labelledby="brainspace-title brainspace-desc" id="brainspace-root">
<title id="brainspace-title">Private context, connected to your code</title>
<desc id="brainspace-desc">A coding agent works in the code repo, whose gitignored links reach project knowledge in the Brain and issues in Beads within a private Brainspace.</desc>
<defs>
      <style>
      #brainspace-root { color-scheme:dark;--paper:#111416;--ink:#f2f4f5;--muted:#b5c0c7;--rule:#39434a;--accent:#5cecd4;--tint:#132a2d }
      #brainspace-root { font-family: Geist,system-ui,sans-serif; }
      #brainspace-root .diagram-container { width:100%;overflow-x:auto }
      #brainspace-root .name, #brainspace-root .group { font:600 17px Geist,system-ui,'Segoe UI',Arial,sans-serif;fill:var(--ink) }
      #brainspace-root .sub { font:400 14px Geist,system-ui,'Segoe UI',Arial,sans-serif;fill:var(--muted) }
      #brainspace-root .technical { font:400 13px 'Geist Mono','Cascadia Mono',Consolas,monospace;fill:var(--muted) }
      #brainspace-root .tag { font:500 10px 'Geist Mono','Cascadia Mono',Consolas,monospace;letter-spacing:.06em;fill:var(--muted) }
      #brainspace-root .arrow-label { font:500 12px 'Geist Mono','Cascadia Mono',Consolas,monospace;fill:var(--muted) }
      #brainspace-root .note, #brainspace-root .legend { font:400 13px Geist,system-ui,'Segoe UI',Arial,sans-serif;fill:var(--muted) }
      #brainspace-root .diagram-container { overflow-x:visible }</style>
<marker id="brainspace-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#b5c0c7"/></marker>
<marker id="brainspace-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#5cecd4"/></marker>
</defs>
<rect width="880" height="520" fill="#111416"/>
<!-- These zones show file locations, not security controls. -->
<rect x="304" y="88" width="244" height="352" rx="8" fill="#1b2025" stroke="#39434a"/>
<rect x="632" y="88" width="208" height="352" rx="8" fill="#132a2d" stroke="#5cecd4"/>
<text x="320" y="112" class="group">Code repo</text>
<text x="648" y="112" class="group" style="fill:var(--accent)">Private Brainspace</text>
<path d="M216 188H320" fill="none" stroke="#b5c0c7" stroke-width="1.2" marker-end="url(#brainspace-arrow)"/>
<path d="M532 300H560Q568 300 568 292V208Q568 200 576 200H648" fill="none" stroke="#5cecd4" stroke-width="1.2" marker-end="url(#brainspace-arrow-accent)"/>
<path d="M532 388H648" fill="none" stroke="#b5c0c7" stroke-width="1.2" marker-end="url(#brainspace-arrow)"/>
<g data-label-mask="true"><rect x="236" y="156" width="64" height="24" fill="#111416"/><text x="268" y="174" class="arrow-label" text-anchor="middle">WORKS IN</text></g>
<g data-label-mask="true"><rect x="564" y="168" width="64" height="24" fill="#111416"/><text x="596" y="186" class="arrow-label" text-anchor="middle">SYMLINK</text></g>
<g data-label-mask="true"><rect x="552" y="356" width="72" height="24" fill="#111416"/><text x="588" y="374" class="arrow-label" text-anchor="middle">SYMLINK</text></g>
<g data-node="agent"><rect x="40" y="140" width="176" height="104" rx="6" fill="#20262b" stroke="#f2f4f5"/>
<rect x="56" y="156" width="68" height="20" rx="2" fill="#1b2025"/><text x="64" y="170" class="tag">RUNTIME</text>
<text x="56" y="200" class="name">Coding agent</text><text x="56" y="224" class="technical">Claude Code / Codex</text></g>
<g data-node="code"><rect x="320" y="136" width="212" height="104" rx="6" fill="#20262b" stroke="#717d84"/>
<text x="336" y="164" class="name">Code and public docs</text><text x="336" y="190" class="sub">Source · tests</text><text x="336" y="212" class="sub">Agent workspace</text></g>
<g data-node="brain-link"><rect x="320" y="264" width="212" height="72" rx="6" fill="#111416" stroke="#717d84"/>
<text x="336" y="292" class="name">Knowledge link</text><text x="336" y="316" class="technical">.brain → private files</text></g>
<g data-node="beads-link"><rect x="320" y="352" width="212" height="72" rx="6" fill="#111416" stroke="#717d84"/>
<text x="336" y="380" class="name">Execution link</text><text x="336" y="404" class="technical">.beads → private tracker</text></g>
<g data-node="brain"><rect x="648" y="136" width="176" height="128" rx="6" fill="#111416" stroke="#717d84"/>
<text x="664" y="164" class="name">Brain</text><text x="664" y="190" class="sub">Decisions · designs</text><text x="664" y="212" class="sub">Vocabulary · runbooks</text><text x="664" y="244" class="note">Separate Git history</text></g>
<g data-node="beads"><rect x="648" y="344" width="176" height="88" rx="6" fill="#1b2025" stroke="#717d84"/>
<text x="664" y="372" class="name">Beads</text><text x="664" y="396" class="sub">Issues · dependencies</text><text x="664" y="418" class="note">Separate backup</text></g>
<text x="320" y="464" class="note">Links excluded from code commits</text>
<text x="648" y="464" class="note">Outside the code repo</text>
<line x1="40" y1="484" x2="840" y2="484" stroke="#39434a"/>
<line x1="40" y1="504" x2="64" y2="504" stroke="#b5c0c7" marker-end="url(#brainspace-arrow)"/><text x="80" y="508" class="legend">Local access</text>
<rect x="240" y="496" width="16" height="16" rx="2" fill="#132a2d" stroke="#5cecd4"/><text x="268" y="508" class="legend">Private context home</text>
<text x="840" y="508" class="legend" text-anchor="end">Knowledge and execution stay distinct</text>
</svg>
